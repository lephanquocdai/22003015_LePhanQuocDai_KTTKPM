server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/users/**

        - id: food-service
          uri: ${FOOD_SERVICE_URL:http://food-service:8082}
          predicates:
            - Path=/foods/**

        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8083}
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8084}
          predicates:
            - Path=/payments/**

        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8085}
          predicates:
            - Path=/inventory/**

        - id: shipping-service
          uri: ${SHIPPING_SERVICE_URL:http://shipping-service:8086}
          predicates:
            - Path=/shipping/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
        cancelRunningFuture: true
