version: '3.8'

services:
  user-service:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081

  food-service:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: food-service
    container_name: food-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082

  order-service:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    container_name: order-service
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - USER_SERVICE_URL=http://user-service:8081
      - FOOD_SERVICE_URL=http://food-service:8082
      - INVENTORY_SERVICE_URL=http://inventory-service:8085
    depends_on:
      - user-service
      - food-service
      - inventory-service

  payment-service:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - ORDER_SERVICE_URL=http://order-service:8083
    depends_on:
      - order-service

  inventory-service:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    container_name: inventory-service
    ports:
      - "8085:8085"
    environment:
      - SERVER_PORT=8085

  shipping-service:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: shipping-service
    container_name: shipping-service
    ports:
      - "8086:8086"
    environment:
      - SERVER_PORT=8086
      - ORDER_SERVICE_URL=http://order-service:8083

  api-gateway:
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - USER_SERVICE_URL=http://user-service:8081
      - FOOD_SERVICE_URL=http://food-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - PAYMENT_SERVICE_URL=http://payment-service:8084
      - INVENTORY_SERVICE_URL=http://inventory-service:8085
      - SHIPPING_SERVICE_URL=http://shipping-service:8086
    depends_on:
      - user-service
      - food-service
      - order-service
      - payment-service
      - inventory-service
      - shipping-service
