services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      - POSTGRES_DB=mydb
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: dockette/adminer:full
    container_name: adminer_tool
    platform: linux/amd64
    ports:
      - "8083:80"
    depends_on:
      - db

volumes:
  postgres_data:
